name: Deploy
run-name: "Deploy #${{ github.run_number }} to production"

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: api/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Build application
        run: pnpm build
